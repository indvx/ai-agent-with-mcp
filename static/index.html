<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Chat Assistant</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bubble: #2563eb;
      --agent-bubble: #1e293b;
      --border-color: #334155;
      --code-bg: #090d16;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .brand-info h1 {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .brand-info p {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.45rem 0.85rem;
      border-radius: 0.375rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-secondary:hover {
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    .layout-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.2s ease, width 0.2s ease;
    }

    .sidebar-top {
      padding: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-new-chat {
      width: 100%;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid var(--accent);
      color: #60a5fa;
      padding: 0.65rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-new-chat:hover {
      background-color: var(--accent);
      color: #ffffff;
    }

    .sidebar-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      padding: 0.85rem 1rem 0.35rem;
      font-weight: 600;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.35rem 0.65rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .session-list::-webkit-scrollbar {
      width: 5px;
    }

    .session-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
      user-select: none;
      color: var(--text-secondary);
      border-left: 3px solid transparent;
      gap: 0.5rem;
    }

    .session-item:hover {
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    .session-item.active {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border-left: 3px solid var(--accent);
    }

    .session-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .session-title {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: inherit;
    }

    .session-time {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .session-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0;
      padding: 0.25rem;
      border-radius: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .session-item:hover .session-delete-btn {
      opacity: 1;
    }

    .session-delete-btn:hover {
      color: var(--error-color);
      background-color: rgba(239, 68, 68, 0.15);
    }

    .session-empty {
      padding: 2rem 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Main Chat Window */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      height: 100%;
      padding: 1rem 1.5rem;
      overflow: hidden;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #chat-window::-webkit-scrollbar {
      width: 6px;
    }

    #chat-window::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .welcome-container {
      margin: auto;
      text-align: center;
      max-width: 540px;
      padding: 2rem 1rem;
    }

    .welcome-container h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .welcome-container p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .suggestion-chips {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chip-btn {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.65rem 1rem;
      border-radius: 0.5rem;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .chip-btn:hover {
      background-color: var(--bg-card);
      border-color: var(--accent);
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.agent {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 80%;
      padding: 0.85rem 1.1rem;
      border-radius: 0.75rem;
      line-height: 1.55;
      font-size: 0.92rem;
      word-break: break-word;
    }

    .message-row.user .message-bubble {
      background-color: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 0.2rem;
    }

    .message-row.agent .message-bubble {
      background-color: var(--agent-bubble);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 0.2rem;
    }

    .message-bubble pre {
      background-color: var(--code-bg);
      padding: 0.75rem;
      border-radius: 0.375rem;
      overflow-x: auto;
      margin: 0.5rem 0;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .message-bubble code {
      background-color: var(--code-bg);
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .message-bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.5rem 0;
      font-size: 0.85rem;
    }

    .message-bubble th,
    .message-bubble td {
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.65rem;
      text-align: left;
    }

    .message-bubble th {
      background-color: var(--code-bg);
      font-weight: 600;
    }

    .message-bubble tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .message-bubble ul,
    .message-bubble ol {
      padding-left: 1.5rem;
      margin: 0.4rem 0;
    }

    .message-bubble h1, .message-bubble h2, .message-bubble h3 {
      margin: 0.6rem 0 0.3rem;
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 0.75rem;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background-color: var(--text-secondary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .input-bar {
      margin-top: 1rem;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
      padding: 0.25rem 0;
    }

    #send-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 65px;
        left: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        box-shadow: 4px 0 18px rgba(0, 0, 0, 0.5);
      }

      .sidebar.sidebar-open {
        transform: translateX(0);
      }

      .chat-main {
        padding: 0.75rem;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <button class="btn-icon" id="sidebar-toggle" type="button" title="Toggle history sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="brand-icon">AI</div>
      <div class="brand-info">
        <h1>MCP Chat Assistant</h1>
        <p>LangGraph Agent with Database Tools</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" id="clear-btn" type="button" title="Start a fresh chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Chat
      </button>
    </div>
  </header>

  <div class="layout-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button id="new-chat-btn" class="btn-new-chat" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Chat
        </button>
      </div>
      <div class="sidebar-section-title">Recent Chats</div>
      <div id="session-list" class="session-list">
        <!-- Loaded dynamically from backend -->
      </div>
    </aside>

    <main class="chat-main">
      <div id="chat-window">
        <div class="welcome-container" id="welcome-message">
          <h2>How can I help you today?</h2>
          <p>Ask questions about the database schema, count tables, or inspect data using Model Context Protocol tools.</p>
          <div class="suggestion-chips">
            <button class="chip-btn" type="button" data-prompt="What tables exist in the database?">What tables exist in the database?</button>
            <button class="chip-btn" type="button" data-prompt="Count all tables in the database">Count all tables in the database</button>
            <button class="chip-btn" type="button" data-prompt="Show me sample records from the primary tables">Show me sample records from the primary tables</button>
          </div>
        </div>
      </div>

      <div class="input-bar">
        <div class="input-row">
          <textarea id="user-input" rows="1" placeholder="Type your message... (Enter to send, Shift+Enter for newline)"></textarea>
          <button id="send-btn" type="button" title="Send message" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="input-footer">
          <span>FastMCP + LangGraph</span>
          <span>MySQL Session Persistence</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    const chatWindow = document.getElementById("chat-window");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");
    const newChatBtn = document.getElementById("new-chat-btn");
    const sessionList = document.getElementById("session-list");
    const sidebar = document.getElementById("sidebar");
    const sidebarToggle = document.getElementById("sidebar-toggle");
    const welcomeMessage = document.getElementById("welcome-message");

    let isProcessing = false;
    let currentSessionId = localStorage.getItem("mcp_chat_session_id");
    if (!currentSessionId) {
      currentSessionId = crypto.randomUUID();
      localStorage.setItem("mcp_chat_session_id", currentSessionId);
    }

    function adjustTextareaHeight() {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
      sendBtn.disabled = !userInput.value.trim() || isProcessing;
    }

    userInput.addEventListener("input", adjustTextareaHeight);

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.querySelectorAll(".chip-btn").forEach((chip) => {
      chip.addEventListener("click", () => {
        userInput.value = chip.getAttribute("data-prompt");
        adjustTextareaHeight();
        sendMessage();
      });
    });

    // Toggle sidebar on mobile or desktop
    sidebarToggle.addEventListener("click", () => {
      sidebar.classList.toggle("sidebar-open");
    });

    // Start fresh chat
    function startNewChat() {
      if (isProcessing) return;
      currentSessionId = crypto.randomUUID();
      localStorage.setItem("mcp_chat_session_id", currentSessionId);

      document.querySelectorAll(".session-item").forEach((item) => {
        item.classList.remove("active");
      });

      chatWindow.innerHTML = "";
      if (welcomeMessage) {
        chatWindow.appendChild(welcomeMessage);
      }
      userInput.value = "";
      adjustTextareaHeight();
      userInput.focus();

      // Close mobile sidebar if open
      sidebar.classList.remove("sidebar-open");
    }

    clearBtn.addEventListener("click", startNewChat);
    newChatBtn.addEventListener("click", startNewChat);

    function formatMarkdown(text) {
      return marked.parse(text);
    }

    function formatSessionDate(isoString) {
      if (!isoString) return "";
      try {
        const date = new Date(isoString);
        const now = new Date();
        const diffMs = now - date;
        const diffSec = Math.floor(diffMs / 1000);
        const diffMin = Math.floor(diffSec / 60);
        const diffHr = Math.floor(diffMin / 60);
        const diffDays = Math.floor(diffHr / 24);

        if (diffMin < 1) return "Just now";
        if (diffMin < 60) return `${diffMin}m ago`;
        if (diffHr < 24) return `${diffHr}h ago`;
        if (diffDays === 1) return "Yesterday";
        if (diffDays < 7) return `${diffDays}d ago`;
        return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      } catch (e) {
        return "";
      }
    }

    function appendMessage(role, content = "") {
      if (welcomeMessage && welcomeMessage.parentNode) {
        welcomeMessage.remove();
      }

      const row = document.createElement("div");
      const normalizedRole = role === "assistant" ? "agent" : role;
      row.className = `message-row ${normalizedRole}`;

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.innerHTML = formatMarkdown(content);

      row.appendChild(bubble);
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return bubble;
    }

    function appendTypingIndicator() {
      if (welcomeMessage && welcomeMessage.parentNode) {
        welcomeMessage.remove();
      }

      const row = document.createElement("div");
      row.className = "message-row agent typing-row";

      const bubble = document.createElement("div");
      bubble.className = "message-bubble typing-indicator";
      bubble.innerHTML = "<span></span><span></span><span></span>";

      row.appendChild(bubble);
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return row;
    }

    async function loadSession(sessionId) {
      if (isProcessing) return;
      currentSessionId = sessionId;
      localStorage.setItem("mcp_chat_session_id", sessionId);

      document.querySelectorAll(".session-item").forEach((item) => {
        if (item.dataset.sessionId === sessionId) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });

      // Close mobile sidebar if open
      sidebar.classList.remove("sidebar-open");

      chatWindow.innerHTML = "";
      const loadingRow = document.createElement("div");
      loadingRow.className = "message-row agent";
      loadingRow.innerHTML = '<div class="message-bubble" style="opacity: 0.7; font-size: 0.85rem;">Loading chat history...</div>';
      chatWindow.appendChild(loadingRow);

      try {
        const response = await fetch(`/chat/sessions/${encodeURIComponent(sessionId)}/history`);
        if (!response.ok) throw new Error("Failed to load history");
        const data = await response.json();

        chatWindow.innerHTML = "";
        if (data.messages && data.messages.length > 0) {
          data.messages.forEach((msg) => {
            appendMessage(msg.role, msg.content);
          });
        } else {
          if (welcomeMessage) {
            chatWindow.appendChild(welcomeMessage);
          }
        }
      } catch (err) {
        chatWindow.innerHTML = "";
        appendMessage("agent", `Unable to load conversation history: ${err.message}`);
      }
    }

    async function deleteSession(e, sessionId) {
      e.stopPropagation();
      if (!confirm("Are you sure you want to delete this conversation?")) return;

      try {
        const response = await fetch(`/chat/sessions/${encodeURIComponent(sessionId)}`, {
          method: "DELETE",
        });
        if (!response.ok) throw new Error("Failed to delete session");

        if (currentSessionId === sessionId) {
          startNewChat();
        }
        await fetchSessions();
      } catch (err) {
        alert(`Failed to delete session: ${err.message}`);
      }
    }

    async function fetchSessions() {
      try {
        const response = await fetch("/chat/sessions");
        if (!response.ok) return;
        const data = await response.json();
        const sessions = data.sessions || [];

        sessionList.innerHTML = "";

        if (sessions.length === 0) {
          sessionList.innerHTML = '<div class="session-empty">No conversation history yet.<br>Start chatting to see sessions here.</div>';
          return;
        }

        sessions.forEach((sess) => {
          const item = document.createElement("div");
          item.className = `session-item ${sess.session_id === currentSessionId ? "active" : ""}`;
          item.dataset.sessionId = sess.session_id;

          const info = document.createElement("div");
          info.className = "session-info";

          const title = document.createElement("div");
          title.className = "session-title";
          title.textContent = sess.title || `Chat ${sess.session_id.slice(0, 8)}`;
          title.title = sess.title || sess.session_id;

          const time = document.createElement("div");
          time.className = "session-time";
          time.textContent = formatSessionDate(sess.created_at);

          info.appendChild(title);
          info.appendChild(time);

          const delBtn = document.createElement("button");
          delBtn.className = "session-delete-btn";
          delBtn.title = "Delete conversation";
          delBtn.setAttribute("type", "button");
          delBtn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          `;
          delBtn.addEventListener("click", (e) => deleteSession(e, sess.session_id));

          item.appendChild(info);
          item.appendChild(delBtn);

          item.addEventListener("click", () => loadSession(sess.session_id));
          sessionList.appendChild(item);
        });
      } catch (err) {
        console.warn("Failed to fetch sessions:", err);
      }
    }

    async function sendMessage() {
      const query = userInput.value.trim();
      if (!query || isProcessing) return;

      appendMessage("user", query);
      userInput.value = "";
      adjustTextareaHeight();

      isProcessing = true;
      sendBtn.disabled = true;

      const typingRow = appendTypingIndicator();

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 120000);

      try {
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, session_id: currentSessionId }),
          signal: controller.signal,
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let bubble = null;
        let accumulatedText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          accumulatedText += chunk;

          if (!bubble) {
            typingRow.remove();
            bubble = appendMessage("agent", "");
          }

          bubble.innerHTML = formatMarkdown(accumulatedText);
          chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        if (!bubble) {
          typingRow.remove();
          appendMessage("agent", "No response received from the server.");
        }
      } catch (err) {
        clearTimeout(timeoutId);
        if (typingRow && typingRow.parentNode) {
          typingRow.remove();
        }

        let errorMsg;
        if (err.name === "AbortError") {
          errorMsg = "Request timed out. The server is taking too long to respond, please try again.";
        } else if (!navigator.onLine) {
          errorMsg = "You appear to be offline. Please check your internet connection.";
        } else {
          errorMsg = `Error: ${err.message}. Please check that the server and MCP tool server are running.`;
        }

        appendMessage("agent", errorMsg);
      } finally {
        isProcessing = false;
        adjustTextareaHeight();
        chatWindow.scrollTop = chatWindow.scrollHeight;
        await fetchSessions();
      }
    }

    async function initApp() {
      await fetchSessions();
      if (currentSessionId) {
        try {
          const res = await fetch(`/chat/sessions/${encodeURIComponent(currentSessionId)}/history`);
          if (res.ok) {
            const data = await res.json();
            if (data.messages && data.messages.length > 0) {
              chatWindow.innerHTML = "";
              data.messages.forEach((msg) => {
                appendMessage(msg.role, msg.content);
              });
            }
          }
        } catch (e) {
          console.warn("Could not load initial history:", e);
        }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
